<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#070D18" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="blueLine" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="greenLine" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="380" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Grid Dots pattern -->
  <g opacity="0.15">
    <circle cx="50" cy="50" r="1.5" fill="#38BDF8" /><circle cx="150" cy="50" r="1.5" fill="#38BDF8" /><circle cx="250" cy="50" r="1.5" fill="#38BDF8" />
    <circle cx="350" cy="50" r="1.5" fill="#38BDF8" /><circle cx="450" cy="50" r="1.5" fill="#38BDF8" /><circle cx="550" cy="50" r="1.5" fill="#38BDF8" />
    <circle cx="650" cy="50" r="1.5" fill="#38BDF8" /><circle cx="750" cy="50" r="1.5" fill="#38BDF8" /><circle cx="850" cy="50" r="1.5" fill="#38BDF8" />
    <circle cx="950" cy="50" r="1.5" fill="#38BDF8" />
    <circle cx="50" cy="190" r="1.5" fill="#38BDF8" /><circle cx="950" cy="190" r="1.5" fill="#38BDF8" />
    <circle cx="50" cy="330" r="1.5" fill="#38BDF8" /><circle cx="950" cy="330" r="1.5" fill="#38BDF8" />
  </g>

  <!-- Title Pill -->
  <rect x="360" y="20" width="280" height="28" rx="14" fill="#0F172A" stroke="#2563EB" stroke-width="1" />
  <text x="500" y="38" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="600" fill="#60A5FA" letter-spacing="1.5">
    CIVICA SYSTEM PIPELINE ARCHITECTURE
  </text>

  <!-- ================= STAGE 1: INGESTION ================= -->
  <g transform="translate(40, 70)">
    <rect width="200" height="260" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
    <rect x="12" y="12" width="70" height="18" rx="4" fill="#1E293B" />
    <text x="47" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" font-weight="600">STAGE 01</text>
    <text x="16" y="55" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Citizen Intake</text>
    <text x="16" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Multimodal Capture</text>

    <!-- Sub-elements -->
    <rect x="16" y="95" width="168" height="40" rx="6" fill="#0B1120" stroke="#1E293B" />
    <text x="26" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" font-weight="600">📸 Scene Photography</text>
    <text x="26" y="126" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Damage context &amp; spatial frame</text>

    <rect x="16" y="145" width="168" height="40" rx="6" fill="#0B1120" stroke="#1E293B" />
    <text x="26" y="162" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F59E0B" font-weight="600">🎙️ Hinglish Voice / Text</text>
    <text x="26" y="176" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Colloquial audio transcription</text>

    <rect x="16" y="195" width="168" height="40" rx="6" fill="#0B1120" stroke="#1E293B" />
    <text x="26" y="212" font-family="'JetBrains Mono', monospace" font-size="10" fill="#EF4444" font-weight="600">📍 Delhi GPS Coordinates</text>
    <text x="26" y="226" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">250 Municipal Ward Polygon</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 242 200 L 278 200" stroke="url(#blueLine)" stroke-width="2.5" stroke-dasharray="4 3" filter="url(#glow)" />
  <polygon points="280,200 274,196 274,204" fill="#38BDF8" />

  <!-- ================= STAGE 2: AI REASONING ================= -->
  <g transform="translate(285, 70)">
    <rect width="210" height="260" rx="12" fill="url(#cardGrad1)" stroke="#2563EB" stroke-width="1.8" filter="url(#glow)" />
    <rect x="12" y="12" width="70" height="18" rx="4" fill="#1E3A8A" />
    <text x="47" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93C5FD" font-weight="600">STAGE 02</text>
    <text x="16" y="55" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#60A5FA">CIVICA AI Engine</text>
    <text x="16" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Gemini 2.0 Flash Core</text>

    <!-- Sub-elements -->
    <rect x="16" y="95" width="178" height="40" rx="6" fill="#0B1120" stroke="#1D4ED8" />
    <text x="26" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD" font-weight="600">🧠 Multimodal Classification</text>
    <text x="26" y="126" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Severity 1-5 &amp; Hazard Matrix</text>

    <rect x="16" y="145" width="178" height="40" rx="6" fill="#0B1120" stroke="#1D4ED8" />
    <text x="26" y="162" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD" font-weight="600">🌐 Spatial Clustering</text>
    <text x="26" y="176" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Deduplicates 50m radius noise</text>

    <rect x="16" y="195" width="178" height="40" rx="6" fill="#0B1120" stroke="#1D4ED8" />
    <text x="26" y="212" font-family="'JetBrains Mono', monospace" font-size="10" fill="#93C5FD" font-weight="600">🏛️ Jurisdictional Router</text>
    <text x="26" y="226" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">MCD vs PWD vs DJB vs DPCC</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 497 200 L 533 200" stroke="url(#blueLine)" stroke-width="2.5" stroke-dasharray="4 3" filter="url(#glow)" />
  <polygon points="535,200 529,196 529,204" fill="#38BDF8" />

  <!-- ================= STAGE 3: MUNICIPAL ACTION ================= -->
  <g transform="translate(540, 70)">
    <rect width="200" height="260" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.2" />
    <rect x="12" y="12" width="70" height="18" rx="4" fill="#1E293B" />
    <text x="47" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" font-weight="600">STAGE 03</text>
    <text x="16" y="55" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Municipal Dispatch</text>
    <text x="16" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Actionable Work-Orders</text>

    <!-- Sub-elements -->
    <rect x="16" y="95" width="168" height="40" rx="6" fill="#0B1120" stroke="#1E293B" />
    <text x="26" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981" font-weight="600">📄 Engineering Work-Order</text>
    <text x="26" y="126" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Formal English dispatch memo</text>

    <rect x="16" y="145" width="168" height="40" rx="6" fill="#0B1120" stroke="#1E293B" />
    <text x="26" y="162" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981" font-weight="600">🚜 Equipment &amp; Labor</text>
    <text x="26" y="176" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">JCB, Tipper, Sludge Pump specs</text>

    <rect x="16" y="195" width="168" height="40" rx="6" fill="#0B1120" stroke="#1E293B" />
    <text x="26" y="212" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981" font-weight="600">⏱️ Ward SLA Timers</text>
    <text x="26" y="226" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">6h / 12h / 24h escalation limits</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 742 200 L 778 200" stroke="url(#greenLine)" stroke-width="2.5" stroke-dasharray="4 3" filter="url(#glow)" />
  <polygon points="780,200 774,196 774,204" fill="#34D399" />

  <!-- ================= STAGE 4: AUDIT & VERIFICATION ================= -->
  <g transform="translate(785, 70)">
    <rect width="175" height="260" rx="12" fill="url(#cardGrad1)" stroke="#059669" stroke-width="1.2" />
    <rect x="12" y="12" width="70" height="18" rx="4" fill="#064E3B" />
    <text x="47" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6EE7B7" font-weight="600">STAGE 04</text>
    <text x="16" y="55" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#34D399">Visual Audit</text>
    <text x="16" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Anti-Fraud Engine</text>

    <!-- Sub-elements -->
    <rect x="14" y="95" width="147" height="40" rx="6" fill="#0B1120" stroke="#047857" />
    <text x="22" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399" font-weight="600">🔍 Before vs After</text>
    <text x="22" y="126" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Site geometry match</text>

    <rect x="14" y="145" width="147" height="40" rx="6" fill="#0B1120" stroke="#047857" />
    <text x="22" y="162" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399" font-weight="600">🛡️ Fake-Fix Buster</text>
    <text x="22" y="176" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Blocks fraudulent claims</text>

    <rect x="14" y="195" width="147" height="40" rx="6" fill="#0B1120" stroke="#047857" />
    <text x="22" y="212" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399" font-weight="600">⭐ Citizen Karma</text>
    <text x="22" y="226" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Community confirmation</text>
  </g>
</svg>
