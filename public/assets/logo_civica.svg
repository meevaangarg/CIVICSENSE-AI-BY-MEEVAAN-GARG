<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="civicaGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="orbGrad" x1="30" y1="20" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#0B1120" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Outer Orbit -->
  <circle cx="60" cy="60" r="38" stroke="url(#civicaGrad)" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.8"/>
  
  <!-- Central Globe Mesh -->
  <circle cx="60" cy="60" r="26" fill="url(#orbGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <ellipse cx="60" cy="60" rx="26" ry="10" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2" fill="none" opacity="0.6"/>
  <line x1="60" y1="34" x2="60" y2="86" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  
  <!-- Target Delhi Pulse Node -->
  <circle cx="68" cy="52" r="4.5" fill="#EF4444"/>
  <circle cx="68" cy="52" r="8" stroke="#EF4444" stroke-width="1.5" opacity="0.6"/>
  <circle cx="68" cy="52" r="12" stroke="#EF4444" stroke-width="1" opacity="0.3"/>
</svg>
